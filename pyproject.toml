[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-buyer-protection"
version = "0.1.0"
description = "Buyer protection for agent purchases: fixes it when your agent buys the wrong thing"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
agent-buyer-protection = "agent_buyer_protection.__main__:main"

[tool.setuptools]
packages = ["agent_buyer_protection"]
